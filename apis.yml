name: Spectra (Defunct / Merged into OVG360)
description: |
  Spectra (formerly Spectra Experiences, originally Comcast-Spectacor Ventures /
  Global Spectrum + Ovations Food Services + Paciolan + Front Row Marketing)
  was a North American venue management, food services & hospitality, and
  partnership-sales company headquartered in Philadelphia, PA. Owned jointly by
  Comcast Spectacor and Atairos, Spectra was acquired by Oak View Group (OVG)
  in a deal announced August 31, 2021 and closed on November 15, 2021 after
  receiving U.S. Department of Justice approval. On February 25, 2022, OVG
  formally consolidated Spectra and OVG Facilities into a single, rebranded
  division called OVG360. The Spectra and Spectra Experiences brands were
  retired as a result, and the spectraexperiences.com domain is no longer
  resolvable. This apis.yml is preserved as an historical record only — Spectra
  never published a public developer API, OpenAPI specification, SDK, or
  developer portal. Operational successor: OVG360
  (https://www.oakviewgroup.com/ovg360-2/). Ticketing platform Paciolan, which
  had been part of the Spectra portfolio, was divested before the OVG deal and
  is now an independent Learfield subsidiary.
